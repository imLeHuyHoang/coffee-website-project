# ==============================================================================
# GitHub Actions: Deploy Infrastructure (Terraform)
# ==============================================================================
# Doc: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#
# Workflow nay:
#   - Push to main    -> terraform plan + apply (tu dong deploy)
#   - Pull Request    -> terraform plan only (review truoc khi merge)
#
# SECRETS CAN THIET (cau hinh trong GitHub repo Settings -> Secrets):
#   AWS_ACCESS_KEY_ID:     Access key cua IAM user
#   AWS_SECRET_ACCESS_KEY: Secret key cua IAM user
#   JWT_SECRET:            JWT secret cho Lambda functions
#
# Doc AWS credentials cho GitHub Actions:
#   https://github.com/aws-actions/configure-aws-credentials
# ==============================================================================

name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/deploy-infrastructure.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/deploy-infrastructure.yml'

# Chi cho phep 1 workflow chay tai 1 thoi diem (tranh conflict)
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.6.0'
  AWS_REGION: 'ap-southeast-1'

jobs:
  # ==========================================================================
  # Job 1: Terraform Plan (chay cho ca PR va push)
  # ==========================================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Install Lambda Layer dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lambda Layer dependencies
        run: cd lambda-src/layer/nodejs && npm ci

      # Terraform workflow
      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="environments/prod.tfvars" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -out=tfplan \
            -no-color
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

      # Upload plan artifact (dung cho apply job)
      - name: Upload Plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  # ==========================================================================
  # Job 2: Terraform Apply (chi chay khi push to main)
  # ==========================================================================
  apply:
    name: Terraform Apply
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lambda Layer dependencies
        run: cd lambda-src/layer/nodejs && npm ci

      - name: Terraform Init
        run: terraform init

      # Download plan tu job truoc
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
