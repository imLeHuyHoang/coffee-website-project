# ==============================================================================
# GitHub Actions: Deploy Frontend (Build + S3 Sync)
# ==============================================================================
# Doc: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#
# Workflow nay:
#   1. Build React app (npm run build)
#   2. Sync build output (dist/) len S3 frontend bucket
#
# Trigger: Push to main khi thay doi frontend code
#
# SECRETS CAN THIET:
#   AWS_ACCESS_KEY_ID:     Access key cua IAM user
#   AWS_SECRET_ACCESS_KEY: Secret key cua IAM user
#
# VARIABLES CAN THIET (GitHub repo Settings -> Variables):
#   FRONTEND_BUCKET_NAME:  Ten S3 bucket frontend (vd: coffee-shop-frontend-yourname)
#   VITE_API_BASE_URL:     API Gateway URL (vd: https://abc.execute-api.ap-southeast-1.amazonaws.com/prod)
# ==============================================================================

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  AWS_REGION: 'ap-southeast-1'

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Sync build output len S3
      # --delete: xoa files tren S3 khong con trong dist/
      # --cache-control: set cache cho browser
      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.FRONTEND_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"

          # index.html va JSON files khong cache (de cap nhat nhanh)
          aws s3 sync dist/ s3://${{ vars.FRONTEND_BUCKET_NAME }} \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "index.html" \
            --include "*.json" \
            --exclude "*" \
            --include "index.html" \
            --include "manifest.json"

      - name: Output deploy URL
        run: |
          echo "========================================"
          echo "  Frontend deployed successfully!"
          echo "  URL: http://${{ vars.FRONTEND_BUCKET_NAME }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
          echo "========================================"
